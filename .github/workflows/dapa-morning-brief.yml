name: DAPA Morning Brief

on:
  schedule:
    - cron: "45,50,55 20 * * *"
    - cron: "0,5,10,15 21 * * *"
  repository_dispatch:
    types: [dapa-morning-brief, dapa-morning-brief-retry]
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

env:
  PYTHONPATH: src
  TZ: Asia/Seoul

jobs:
  scheduled-brief:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'repository_dispatch' &&
      github.event.action == 'dapa-morning-brief-retry')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: dapa-morning-brief-delivery
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KSKILL_PROXY_BASE_URL: https://k-skill-proxy.nomadamas.org
    steps:
      - uses: actions/checkout@v4
      - id: kst-date
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - id: sent-cache
        uses: actions/cache/restore@v4
        with:
          path: .dapa-sent
          key: dapa-morning-brief-${{ steps.kst-date.outputs.today }}
      - uses: actions/setup-python@v5
        if: steps.sent-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        if: steps.sent-cache.outputs.cache-hit != 'true'
      - if: steps.sent-cache.outputs.cache-hit != 'true'
        run: uv sync
      - name: Install Copilot CLI
        if: steps.sent-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm install -g @github/copilot
      - name: Prepare complete morning brief
        if: steps.sent-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline_epoch=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 06:20:00" +%s)
          attempt=1
          while true; do
            now_epoch=$(TZ=Asia/Seoul date +%s)
            remaining_seconds=$((deadline_epoch - now_epoch))
            if [ "$remaining_seconds" -le 0 ]; then
              echo "Preparation retry deadline reached at 06:20 KST."
              exit 1
            fi

            rm -f .dapa-prepared/morning-brief.json
            echo "Preparation attempt ${attempt}."
            if timeout --foreground "${remaining_seconds}s" \
              uv run python -m dapa_morning_brief.cli \
              --days 1 --fallback-days 2 \
              --prepare-output .dapa-prepared/morning-brief.json; then
              if [ -s .dapa-prepared/morning-brief.json ]; then
                break
              fi
            fi

            now_epoch=$(TZ=Asia/Seoul date +%s)
            next_retry_epoch=$((now_epoch + 60))
            if [ "$next_retry_epoch" -ge "$deadline_epoch" ]; then
              echo "No full one-minute retry remains before 06:20 KST."
              exit 1
            fi
            echo "Preparation attempt ${attempt} failed; retrying in 60 seconds."
            sleep 60
            attempt=$((attempt + 1))
          done
      - name: Enforce 06:20 KST preparation deadline
        if: steps.sent-cache.outputs.cache-hit != 'true'
        run: |
          now_epoch=$(TZ=Asia/Seoul date +%s)
          deadline_epoch=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 06:20:00" +%s)
          if [ "$now_epoch" -gt "$deadline_epoch" ]; then
            echo "Preparation completed after 06:20 KST."
            exit 1
          fi
      - name: Wait for the 06:30 KST send minute
        if: steps.sent-cache.outputs.cache-hit != 'true'
        run: |
          now_epoch=$(TZ=Asia/Seoul date +%s)
          target_epoch=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 06:30:00" +%s)
          latest_epoch=$((target_epoch + 45))
          if [ "$now_epoch" -gt "$latest_epoch" ]; then
            echo "06:30 KST send minute was missed; Telegram will not be called."
            exit 1
          fi
          if [ "$now_epoch" -lt "$target_epoch" ]; then
            sleep "$((target_epoch - now_epoch))"
          fi
          send_minute=$(TZ=Asia/Seoul date +%H:%M)
          if [ "$send_minute" != "06:30" ]; then
            echo "Telegram send is restricted to 06:30 KST."
            exit 1
          fi
      - name: Send prepared Telegram brief
        if: steps.sent-cache.outputs.cache-hit != 'true'
        run: >-
          uv run python -m dapa_morning_brief.cli
          --prepared-input .dapa-prepared/morning-brief.json
      - name: Mark scheduled brief sent
        if: steps.sent-cache.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .dapa-sent
          echo "${{ steps.kst-date.outputs.today }}" > ".dapa-sent/${{ steps.kst-date.outputs.today }}"
      - if: steps.sent-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .dapa-sent
          key: dapa-morning-brief-${{ steps.kst-date.outputs.today }}

  retry-failed-run:
    needs: scheduled-brief
    if: >-
      always() &&
      needs.scheduled-brief.result == 'failure' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'repository_dispatch' &&
      github.event.action == 'dapa-morning-brief-retry'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Re-dispatch failed run every minute before 06:20 KST
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline_epoch=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 06:20:00" +%s)
          while true; do
            now_epoch=$(TZ=Asia/Seoul date +%s)
            next_retry_epoch=$((now_epoch + 60))
            if [ "$next_retry_epoch" -ge "$deadline_epoch" ]; then
              echo "Workflow retry deadline reached; no late run will be dispatched."
              exit 1
            fi

            sleep 60
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type=dapa-morning-brief-retry; then
              echo "A replacement workflow run was dispatched."
              exit 0
            fi
            echo "Retry dispatch failed; trying again in 60 seconds."
          done

  manual-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
      github.event.action == 'dapa-morning-brief')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KSKILL_PROXY_BASE_URL: https://k-skill-proxy.nomadamas.org
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install Copilot CLI
        continue-on-error: true
        run: npm install -g @github/copilot
      - name: Collect and preview morning brief
        run: >-
          uv run python -m dapa_morning_brief.cli
          --days 1 --fallback-days 2 --dry-run
