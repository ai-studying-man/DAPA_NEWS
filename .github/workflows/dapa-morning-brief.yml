name: DAPA Morning Brief

on:
  repository_dispatch:
    types:
      - dapa-morning-brief
      - dapa-morning-brief-retry
      - dapa-morning-brief-watchdog
  workflow_dispatch:
    inputs:
      resend:
        description: Recollect and resend today's Telegram brief once
        required: false
        type: boolean
        default: false
      copilot_test:
        description: Test Copilot CLI without collecting or sending news
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  copilot-requests: write

env:
  PYTHONPATH: src
  TZ: Asia/Seoul
  MAX_RETRY_RUNS: 5

jobs:
  copilot-smoke-test:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.copilot_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Call Copilot model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .copilot-smoke/logs
          copilot --version | tee .copilot-smoke/version.txt

          set +e
          copilot \
            -s \
            --no-ask-user \
            --model auto \
            --log-level error \
            --log-dir .copilot-smoke/logs \
            -p "Reply with exactly COPILOT_OK and nothing else." \
            > .copilot-smoke/response.txt \
            2> .copilot-smoke/stderr.txt
          copilot_exit_code=$?
          set -e

          printf '%s\n' "$copilot_exit_code" > .copilot-smoke/exit-code.txt
          echo "Copilot CLI exit code: $copilot_exit_code"
          if [ "$copilot_exit_code" -ne 0 ]; then
            echo "Copilot CLI error output:"
            sed -n '1,80p' .copilot-smoke/stderr.txt
            exit "$copilot_exit_code"
          fi

          normalized_response=$(tr -d '\r\n' < .copilot-smoke/response.txt)
          echo "Copilot model response: $normalized_response"
          if [ "$normalized_response" != "COPILOT_OK" ]; then
            echo "Copilot returned an unexpected response."
            exit 1
          fi

          {
            echo "## Copilot smoke test"
            echo
            echo "- Authentication: successful"
            echo "- Model response: COPILOT_OK"
            echo "- Telegram delivery: not invoked"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Copilot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .copilot-smoke
          include-hidden-files: true
          retention-days: 7

  scheduled-brief:
    if: >-
      (github.event_name == 'repository_dispatch' &&
      (github.event.action == 'dapa-morning-brief' ||
      github.event.action == 'dapa-morning-brief-retry' ||
      github.event.action == 'dapa-morning-brief-watchdog')) ||
      (github.event_name == 'workflow_dispatch' && inputs.resend)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: dapa-morning-brief-delivery
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KSKILL_PROXY_BASE_URL: https://k-skill-proxy.nomadamas.org
      FORCE_DELIVERY: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.resend) ||
        github.event.client_payload.force_send == true }}
    steps:
      - uses: actions/checkout@v4
      - id: kst-date
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Log trigger and delivery schedule
        run: |
          echo "[DAPA Morning Brief]"
          echo "Trigger: ${GITHUB_EVENT_NAME} / ${{ github.event.action || 'workflow_dispatch' }}"
          echo "Current KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Collection target: 05:45 KST"
          echo "Preparation target: 06:20 KST"
          echo "Telegram send target: 06:30 KST"
      - id: sent-cache
        uses: actions/cache/restore@v4
        with:
          path: .dapa-sent
          key: dapa-morning-brief-${{ steps.kst-date.outputs.today }}
      - name: Log Telegram sent status
        run: >-
          echo "Telegram sent today: ${{ steps.sent-cache.outputs.cache-hit == 'true' }}"
      - name: Wait until 05:45 KST before collection
        if: >-
          steps.sent-cache.outputs.cache-hit != 'true' &&
          env.FORCE_DELIVERY != 'true'
        run: |
          now_epoch=$(TZ=Asia/Seoul date +%s)
          target_epoch=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 05:45:00" +%s)
          wait_seconds=$((target_epoch - now_epoch))
          if [ "$wait_seconds" -gt 0 ]; then
            echo "Waiting ${wait_seconds}s until 05:45 KST..."
            sleep "$wait_seconds"
          else
            echo "05:45 KST has already passed. Starting immediately."
          fi
      - uses: actions/setup-python@v5
        if: >-
          steps.sent-cache.outputs.cache-hit != 'true' ||
          env.FORCE_DELIVERY == 'true'
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        if: >-
          steps.sent-cache.outputs.cache-hit != 'true' ||
          env.FORCE_DELIVERY == 'true'
      - if: >-
          steps.sent-cache.outputs.cache-hit != 'true' ||
          env.FORCE_DELIVERY == 'true'
        run: uv sync
      - name: Install Copilot CLI
        if: >-
          steps.sent-cache.outputs.cache-hit != 'true' ||
          env.FORCE_DELIVERY == 'true'
        continue-on-error: true
        run: npm install -g @github/copilot
      - name: Prepare complete morning brief
        if: >-
          steps.sent-cache.outputs.cache-hit != 'true' ||
          env.FORCE_DELIVERY == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ready_target_epoch=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 06:20:00" +%s)
          rm -f .dapa-prepared/morning-brief.json
          timeout --foreground 1200s \
            uv run python -m dapa_morning_brief.cli \
            --days 1 --fallback-days 2 \
            --prepare-output .dapa-prepared/morning-brief.json
          test -s .dapa-prepared/morning-brief.json
          completed_epoch=$(TZ=Asia/Seoul date +%s)
          if [ "$completed_epoch" -le "$ready_target_epoch" ]; then
            echo "Preparation completed: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Preparation completed by the 06:20 KST target."
          else
            echo "Preparation completed: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "WARNING: Preparation completed after the 06:20 KST target; delivery will continue."
          fi
      - name: Upload prepared brief diagnostics
        if: >-
          steps.sent-cache.outputs.cache-hit != 'true' ||
          env.FORCE_DELIVERY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dapa-prepared-${{ github.run_id }}
          path: .dapa-prepared/morning-brief.json
          retention-days: 30
      - name: Wait until 06:30 KST when early
        if: >-
          steps.sent-cache.outputs.cache-hit != 'true' ||
          env.FORCE_DELIVERY == 'true'
        run: |
          now_epoch=$(TZ=Asia/Seoul date +%s)
          target_epoch=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 06:30:00" +%s)
          if [ "$now_epoch" -lt "$target_epoch" ] && [ "$FORCE_DELIVERY" != "true" ]; then
            sleep "$((target_epoch - now_epoch))"
          elif [ "$FORCE_DELIVERY" = "true" ]; then
            echo "FORCE_DELIVERY=true; skipping 06:30 KST wait and sending now."
          else
            echo "06:30 KST target was missed; sending immediately."
          fi
      - name: Send prepared Telegram brief
        if: >-
          steps.sent-cache.outputs.cache-hit != 'true' ||
          env.FORCE_DELIVERY == 'true'
        run: >-
          uv run python -m dapa_morning_brief.cli
          --prepared-input .dapa-prepared/morning-brief.json
      - name: Mark scheduled brief sent
        if: steps.sent-cache.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .dapa-sent
          echo "${{ steps.kst-date.outputs.today }}" > ".dapa-sent/${{ steps.kst-date.outputs.today }}"
      - if: steps.sent-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .dapa-sent
          key: dapa-morning-brief-${{ steps.kst-date.outputs.today }}

  retry-failed-run:
    needs: scheduled-brief
    if: >-
      always() &&
      needs.scheduled-brief.result == 'failure' &&
      ((github.event_name == 'repository_dispatch' &&
      (github.event.action == 'dapa-morning-brief' ||
      github.event.action == 'dapa-morning-brief-retry' ||
      github.event.action == 'dapa-morning-brief-watchdog')) ||
      (github.event_name == 'workflow_dispatch' && inputs.resend))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Collect failed-run diagnostics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .dapa-diagnostics
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > .dapa-diagnostics/jobs.json; then
            printf '{"jobs":[]}' > .dapa-diagnostics/jobs.json
          fi
          jq \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg action "${{ github.event.action || '' }}" \
            --arg sha "${GITHUB_SHA}" \
            --arg retry_count "${{ github.event.client_payload.retry_count || '0' }}" \
            '{
              recorded_at_utc: (now | todateiso8601),
              run_url: $run_url,
              event: $event,
              action: $action,
              sha: $sha,
              retry_count: $retry_count,
              failed_jobs: [
                .jobs[] |
                select(
                  .conclusion == "failure" or
                  .conclusion == "cancelled" or
                  .conclusion == "timed_out" or
                  .conclusion == "action_required" or
                  .conclusion == "stale"
                ) |
                {
                  id, name, conclusion, started_at, completed_at,
                  failed_steps: [
                    .steps[]? |
                    select(
                      .conclusion == "failure" or
                      .conclusion == "cancelled" or
                      .conclusion == "timed_out" or
                      .conclusion == "action_required" or
                      .conclusion == "stale"
                    ) |
                    {number, name, conclusion, started_at, completed_at}
                  ]
                }
              ]
            }' .dapa-diagnostics/jobs.json \
            > .dapa-diagnostics/failure-report.json
          {
            echo "## DAPA failed-run diagnostics"
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Retry count: ${{ github.event.client_payload.retry_count || '0' }}"
            jq -r '.failed_jobs[] | "- Failed job: \(.name) [\(.conclusion)]", (.failed_steps[] | "  - Step: \(.name) [\(.conclusion)]")' \
              .dapa-diagnostics/failure-report.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failed-run diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dapa-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dapa-diagnostics/failure-report.json
          retention-days: 30
      - name: Re-dispatch failed workflow run after one minute
        env:
          CURRENT_RETRY_RUNS: ${{ github.event.client_payload.retry_count || '0' }}
          FORCE_SEND: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.resend) ||
            github.event.client_payload.force_send || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$CURRENT_RETRY_RUNS" in
            ''|*[!0-9]*) current_retry_runs=0 ;;
            *) current_retry_runs=$CURRENT_RETRY_RUNS ;;
          esac
          next_retry_runs=$((current_retry_runs + 1))
          if [ "$next_retry_runs" -gt "$MAX_RETRY_RUNS" ]; then
            echo "Maximum replacement workflow count reached."
            exit 1
          fi

          while true; do
            now_epoch=$(TZ=Asia/Seoul date +%s)
            next_retry_epoch=$((now_epoch + 60))
            echo "Replacement run ${next_retry_runs} will be requested at ${next_retry_epoch}."
            sleep 60
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type=dapa-morning-brief-retry \
              -F "client_payload[retry_count]=${next_retry_runs}" \
              -F "client_payload[force_send]=${FORCE_SEND}"; then
              echo "A replacement workflow run was dispatched."
              exit 0
            fi
            echo "Retry dispatch failed; trying again in 60 seconds."
          done

  manual-preview:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.resend != true && inputs.copilot_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KSKILL_PROXY_BASE_URL: https://k-skill-proxy.nomadamas.org
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install Copilot CLI
        continue-on-error: true
        run: npm install -g @github/copilot
      - name: Prepare AI-powered morning brief without Telegram
        run: >-
          uv run python -m dapa_morning_brief.cli
          --days 1 --fallback-days 2
          --prepare-output .dapa-preview/morning-brief.json
      - name: Preview prepared morning brief without Telegram
        run: >-
          uv run python -m dapa_morning_brief.cli
          --prepared-input .dapa-preview/morning-brief.json
          --dry-run
      - name: Upload AI preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dapa-ai-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dapa-preview/morning-brief.json
          include-hidden-files: true
          retention-days: 7
